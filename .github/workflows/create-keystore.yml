name: Create signing keystore (run once)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore release.jks -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=DG Coders, O=DG Coders, C=PK"
          mkdir out
          base64 -w0 release.jks > out/KEYSTORE_BASE64.txt
          printf 'KEYSTORE_PASSWORD=%s\nKEY_ALIAS=release\nKEY_PASSWORD=%s\n' "$PASS" "$PASS" > out/credentials.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: out/
          retention-days: 1
